name: libcloak
description: "The TSL1_SP shielded pool wallet library: keys, notes, invoices, payments and their proofs, for people paying people without scanning a chain."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.1

dependencies:
  tstokenlib:
    path: ../tstokenlib
  dartsv: ^3.1.0
  convert: ^3.1.2
  crypto: ^3.0.6
  cryptography: ^2.7.0
  meta: ^1.15.0
  path: ^1.8.3

dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0
  # the coordinator, for the end-to-end run on localnet only. A wallet does
  # not depend on the server it talks to; its test suite does, because the
  # only way to show the two agree is to run one against the other.
  pool_coordinator:
    path: ../pool-coordinator
  dart_libp2p: ^2.0.0
  logging: ^1.2.0
